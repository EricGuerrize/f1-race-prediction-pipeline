name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-demo:
    name: Lint · Test · Demo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install package + dev deps
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Pytest (sem rede)
        run: uv run pytest
        env:
          # Garante que testes não dependam de rede
          F1P_HTTP_TIMEOUT_SECONDS: "1"

      - name: Demo offline (sample)
        run: uv run f1p demo

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-test-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: f1-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
