[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1-pipeline"
version = "0.1.0"
description = "Pipeline de engenharia de dados + ML para prever resultados da Fórmula 1"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Eric Guerrize" },
]
keywords = ["formula1", "data-engineering", "duckdb", "ml", "fastf1"]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "tenacity>=8.2",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "duckdb>=1.0",
  "pandera>=0.20",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastf1>=3.4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "pre-commit>=3.7",
  "mypy>=1.10",
]

[project.scripts]
f1p = "f1_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_pipeline"]

[tool.hatch.build.targets.sdist]
include = ["src/f1_pipeline", "README.md", "LICENSE", "data/sample"]

[tool.hatch.build.targets.wheel.sources]
"src/f1_pipeline" = "f1_pipeline"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Campos bronze espelham nomes das APIs (FastF1 / Ergast)
"src/f1_pipeline/schemas/bronze.py" = ["N815"]

[tool.ruff.lint.isort]
known-first-party = ["f1_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "integration: testes que podem usar rede (desabilitados no CI)",
]

[tool.coverage.run]
source = ["f1_pipeline"]
branch = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
packages = ["f1_pipeline"]
mypy_path = "src"
